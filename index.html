<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG HUD</title>

    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<header class="topbar">

    <nav class="tabs">
        <button class="tab active" data-tab="hud">HUD</button>
        <button class="tab" data-tab="stats">STATS</button>
        <button class="tab" data-tab="quests">QUESTS</button>
    </nav>

</header>

<main>

    <!-- ================= HUD ================= -->

    <section id="hud" class="view active">

        <div class="panel">

            <h2>Status</h2>

            <div class="bar-block">

                <label>HP <span id="hpText"></span></label>

                <div class="bar">
                    <div id="hpBar" class="fill hp"></div>
                </div>

            </div>

            <div class="bar-block">

                <label>MP <span id="mpText"></span></label>

                <div class="bar">
                    <div id="mpBar" class="fill mp"></div>
                </div>

            </div>

        </div>

        <div class="panel">

            <h2>Log Event</h2>

            <form id="eventForm">

                <input
                    id="eventName"
                    type="text"
                    placeholder="Event name..."
                    required
                >

                <select id="eventType">

                    <option value="work">Work (-10 MP)</option>
                    <option value="exercise">Exercise (+5 HP)</option>
                    <option value="damage">Stress (-10 HP)</option>

                </select>

                <button type="submit">
                    Log
                </button>

            </form>

        </div>

        <div class="panel">

            <h2>Combat Log</h2>

            <div id="combatLog" class="combat-log"></div>

        </div>

    </section>

    <!-- ================= STATS ================= -->

    <section id="stats" class="view">

        <div class="panel">
            <h2>Stats</h2>

            <p>Current HP: <span id="statsHP"></span></p>
            <p>Current MP: <span id="statsMP"></span></p>
            <p>Max MP: <span id="statsMaxMP"></span></p>

        </div>

    </section>

    <!-- ================= QUESTS ================= -->

    <section id="quests" class="view">

        <div class="panel">

            <h2>Quests</h2>

            <p>No quests yet.</p>

        </div>

    </section>

</main>

<!-- ================= MODAL ================= -->

<div id="awakeningModal" class="modal hidden">

    <div class="modal-card">

        <h2>Daily Awakening</h2>

        <p>How well did you sleep?</p>

        <div class="modal-buttons">

            <button data-sleep="100">
                Perfect
            </button>

            <button data-sleep="70">
                Mediocre
            </button>

            <button data-sleep="40">
                Trash
            </button>

        </div>

    </div>

</div>

</body>
</html>
