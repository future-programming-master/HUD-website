<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Life HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- HUD Header -->
        <div class="char-header">
            <h2>REAL LIFE HUD</h2>
            <div class="level-control">
                <button class="lvl-btn" onclick="changeLevel(-1)">-</button>
                <span class="level-tag">DAY <span id="level-value">1</span></span>
                <button class="lvl-btn" onclick="changeLevel(1)">+</button>
            </div>
        </div>

        <!-- HP (Energy) Section -->
        <div class="stat-container">
            <div class="stat-labels">
                <span class="stat-name hp-text">ENERGY (HP)</span>
                <span class="stat-values"><span id="hp-current">100</span> / 100</span>
            </div>
            <div class="bar-border">
                <div id="hp-fill" class="bar-fill hp-bar" style="width: 100%;"></div>
            </div>
        </div>

        <!-- MP (Time Left / Capacity) Section -->
        <div class="stat-container">
            <div class="stat-labels">
                <span class="stat-name mp-text">TIME / WORK (MP)</span>
                <span class="stat-values"><span id="mp-current">100</span> / 100</span>
            </div>
            <div class="bar-border">
                <div id="mp-fill" class="bar-fill mp-bar" style="width: 100%;"></div>
            </div>
        </div>

        <!-- Dynamic Action Logger Form -->
        <div class="action-panel">
            <h3>LOG NEW EVENT</h3>
            <input type="text" id="event-text" placeholder="e.g., Watched reels 30min" autocomplete="off">
            
            <div class="value-pickers">
                <div class="picker-group">
                    <label class="hp-text">HP change</label>
                    <input type="number" id="event-hp" value="-5">
                </div>
                <div class="picker-group">
                    <label class="mp-text">MP change</label>
                    <input type="number" id="event-mp" value="-15">
                </div>
            </div>
            
            <button id="submit-event-btn" onclick="applyLifeEvent()">EXECUTE ACTION</button>
        </div>

        <!-- Combat / Activity Log -->
        <div class="log-panel">
            <div class="log-header">
                <h3>BUFFS / DEBUFFS LOG</h3>
                <button class="clear-btn" onclick="clearLog()">Clear Log</button>
            </div>
            <div id="combat-log" class="combat-log-box">
                <div class="log-entry system-msg">[System initialized. Have a productive day.]</div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
